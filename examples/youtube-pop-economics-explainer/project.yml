project_name: "youtube-pop-economics-explainer"
pipeline: "faceless-explainer"
profile: "youtube-long"
aspect_ratio: "16:9"

input:
  audio_file: ""
  script_file: "./input/script.txt"
  style_bible: "./input/style-bible.yml"
  character_bible: "./input/characters.yml"
  channel_bible: "./input/channel-bible.yml"

output:
  folder: "./output"

generation:
  image_provider: "external"
  preview_scenes: 5
  scene_duration_target_seconds: 8
  max_scene_duration_seconds: 12
  min_scene_duration_seconds: 5
  images_per_scene: 1
  words_per_minute: 145

transcription:
  provider: "script"
  model: "whisper-1"

providers:
  openai:
    image_model: "gpt-image-1"
    image_size: "auto"
    image_quality: "medium"
    image_output_format: "png"
    transcription_model: "whisper-1"

copy:
  provider: "heuristic"
  title_options: 8

scene_production:
  default_layout: "auto"
  continuity: "auto"
  additive_layers: 3
  voxpop_background: "consistent interview-style background"
  voxpop_middle_ground: "recurring presenter or interview subject"
  voxpop_foreground: "microphone, caption card, phone, or reaction prop"
  screen_demo_surface: "screen recording or screenshot from input/assets/"

costs:
  currency: "GBP"
  image_cost_per_generation: 0.04
  cost_multiplier: 2

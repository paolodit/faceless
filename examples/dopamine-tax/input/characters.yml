characters:
  - name: "Main Character"
    role: "protagonist"
    appearance:
      body_type: "ordinary adult"
      clothing: "plain jumper, loose trousers, simple trainers"
      hair: "slightly messy dark hair"
      expression_range:
        - "hopeful"
        - "frazzled"
        - "caught out"
        - "resigned"
    personality:
      traits:
        - "self-aware"
        - "tries to be productive"
        - "gets pulled into tiny loops"
    prompt_anchor: "same simple hand-drawn recurring character, plain jumper, slightly messy dark hair, expressive eyebrows"

  - name: "The App"
    role: "abstract antagonist"
    appearance:
      body_type: "glowing phone screen with small notification shapes"
      expression_range:
        - "tempting"
        - "too cheerful"
        - "quietly demanding"
    personality:
      traits:
        - "interrupts"
        - "promises usefulness"
        - "creates tiny emotional fees"
    prompt_anchor: "glowing smartphone with friendly but suspicious notification bubbles, simple flat cartoon style"

channel_name: "Practical AI Ops"
audience: "founders, operators and team leads who want useful AI adoption without hype"
platform_priorities:
  - "linkedin-video"

voice:
  tone: "practical, direct and commercially useful"
  point_of_view: "advisor speaking from experience"
  pacing: "clear first-line insight, specific operational examples, concise takeaway"

content_pillars:
  - "AI workflow mapping"
  - "team adoption"
  - "operational bottlenecks"
  - "practical implementation"

recurring_formats:
  - "the mistake is not the tool"
  - "map the workflow before buying software"
  - "one practical AI adoption tip"

publishing:
  default_cta: "Map the workflow before you choose the tool."
  description_boilerplate: "A practical AI operations video made with faceless video-pack."
  hashtags:
    - "#AIAdoption"
    - "#Operations"
    - "#Workflow"

prompt_rules:
  always_include:
    - "business-useful visual metaphor"
    - "calm feed-friendly composition"
  avoid:
    - "hype language"
    - "robot mascots"
    - "dense UI text"
  thumbnail_rules:
    - "one bottleneck visual"
    - "clear before/after contrast"
  title_rules:
    - "lead with the practical mistake"
    - "avoid vague AI productivity claims"

style_name: "LinkedIn Workflow Mapping"

visual_style:
  medium: "clean professional editorial illustration"
  line_quality: "precise lines, soft rounded corners and restrained texture"
  colour_palette: "white, charcoal, muted teal, signal green and warm coral accents"
  background_style: "workplace boards, process maps, simple desks and calm abstract UI shapes"
  visual_complexity: "low to medium"
  emotional_tone: "useful, calm and commercially credible"

composition_rules:
  aspect_ratio: "4:5"
  framing: "feed-friendly composition with one clear business idea per frame"
  readability: "works without sound and leaves space for editor-added captions"
  subject_size: "large central subject or simple diagram-like metaphor"

prompt_rules:
  always_include:
    - "professional but human"
    - "clear workflow metaphor"
    - "restrained business visual style"
  avoid:
    - "generic robot imagery"
    - "glowing sci-fi dashboards"
    - "stock photo boardroom feel"
    - "tiny captions or dense factual text that needs perfect readability"

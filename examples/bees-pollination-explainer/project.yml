project_name: "bees-pollination-explainer"
pipeline: "narrated-explainer"
profile: "tiktok"
aspect_ratio: "9:16"

input:
  audio_file: ""
  script_file: "./input/script.txt"
  style_bible: "./input/style-bible.yml"
  character_bible: "./input/characters.yml"
  channel_bible: "./input/channel-bible.yml"

output:
  folder: "./output"

generation:
  image_provider: "external"
  preview_scenes: 5
  scene_duration_target_seconds: 5
  max_scene_duration_seconds: 7
  min_scene_duration_seconds: 3
  images_per_scene: 1
  words_per_minute: 155

transcription:
  provider: "script"
  model: "whisper-1"

providers:
  openai:
    image_model: "gpt-image-1"
    image_size: "auto"
    image_quality: "medium"
    image_output_format: "png"
    transcription_model: "whisper-1"

visual_events:
  enabled: true
  mode: "auto"
  default_pacing: "profile"
  max_events_per_scene: 6
  create_overlay_plan: true
  create_stock_queries: false

scene_production:
  default_layout: "auto"
  continuity: "segment"
  additive_layers: 3
  voxpop_background: "not used"
  voxpop_middle_ground: "not used"
  voxpop_foreground: "not used"

stock_assets:
  enabled: false
  provider: "mock"
  media_type: "photo"
  max_assets: 14
  orientation: "portrait"
  safe_search: true

copy:
  provider: "heuristic"
  title_options: 8

costs:
  currency: "GBP"
  image_cost_per_generation: 0.04
  cost_multiplier: 2
